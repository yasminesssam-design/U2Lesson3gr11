<!DOCTYPE html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOHTARF | Incident Response & Risk Management | الاستجابة للحوادث وإدارة المخاطر</title>
<style>
*{box-sizing:border-box}html{font-size:20px}
body{margin:0;font-family:Tahoma,Arial,sans-serif;font-size:1.1rem;color:#1b2a4a;min-height:100vh;background:linear-gradient(135deg,#fff6d6,#d9f3ff,#e6ddff,#d8ffe9);background-size:300% 300%;animation:bg 16s ease infinite;overflow-x:hidden}
@keyframes bg{50%{background-position:100% 50%}}
.bub{position:fixed;bottom:-80px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(90,140,255,.28));animation:up linear infinite;z-index:0}
@keyframes up{to{transform:translateY(-125vh) rotate(180deg)}}
.w{position:relative;z-index:1;max-width:1000px;margin:auto;padding:0 14px 40px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;background:#fff;margin:0 -14px;padding:10px 18px;border-bottom:5px solid #ff7a59;box-shadow:0 6px 20px #1b2a4a22;direction:ltr}
header img{width:74px;height:74px;border-radius:50%;animation:pul 3s infinite}
@keyframes pul{50%{transform:scale(1.08) rotate(-4deg)}}
h1{margin:0;font-size:1.25rem;line-height:1.5;color:#1d3f9e}h1 small{display:block;font-size:.8rem;color:#ff7a59}
nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:16px 0}
button{font:inherit;font-size:1rem;cursor:pointer;border:0;border-radius:16px;padding:12px 14px;background:#fff;color:#1d3f9e;font-weight:700;box-shadow:0 4px 0 #c9d4ee;transition:.15s}
button:hover{transform:translateY(-3px)}button:active{transform:translateY(2px);box-shadow:none}
nav button.on{background:#1d3f9e;color:#fff;box-shadow:0 4px 0 #0e2468}
.p{display:none;background:#fff;border-radius:28px;padding:22px;box-shadow:0 12px 40px #1b2a4a22;animation:in .5s}.p.on{display:block}
@keyframes in{from{opacity:0;transform:scale(.96) translateY(20px)}}
h2{margin:0 0 12px;padding:10px 16px;border-radius:16px;background:linear-gradient(90deg,#ff7a59,#ffb347);color:#fff;font-size:1.3rem}
h3{color:#1d3f9e;border-bottom:3px dashed #ffb347;padding-bottom:6px}
.ar{direction:rtl;text-align:right;margin:8px 0;line-height:2;font-size:1.1rem}
.en{direction:ltr;text-align:left;margin:8px 0;line-height:1.7;color:#4a35b8;background:#f1eeff;border-radius:12px;padding:8px 12px}
.box{background:#fff8e6;border-radius:16px;padding:10px;margin:12px 0;border:2px solid #ffd27a}
.q{background:#f5f8ff;border:2px solid #dbe4ff;border-radius:20px;padding:14px;margin:16px 0}
.q .ar b,.q .en b{font-size:1.1rem}
.o{display:block;width:100%;margin:8px 0;background:#fff;color:#1b2a4a;text-align:center;border:3px solid #c9d4ee;box-shadow:none}.o:hover{border-color:#1d3f9e;background:#eef3ff}
.o.r{background:#2ecc71;border-color:#1b9e50;color:#fff}.o.x{background:#ff5a5f;border-color:#c93a3f;color:#fff}
.o span{display:block}.o span+span{font-size:.9em;opacity:.8}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;color:#1b2a4a}td{border:1px solid #c9d4ee;padding:8px;text-align:center}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.st div{border-radius:18px;padding:12px;text-align:center;color:#fff;animation:in .6s both}
.st div:nth-child(1){background:#4f8cff}.st div:nth-child(2){background:#8a5cf6}.st div:nth-child(3){background:#ff7a59}.st div:nth-child(4){background:#f0a020}.st div:nth-child(5){background:#22b573}.st div:nth-child(6){background:#e0457b}
.sc{position:sticky;top:98px;z-index:4;background:#1d3f9e;color:#fff;border-radius:14px;padding:8px;text-align:center;font-weight:700;margin:8px 0}
input{font:inherit;padding:12px;border-radius:14px;border:3px solid #c9d4ee;width:80%;max-width:360px;margin:8px 0}
.f{position:fixed;top:-30px;font-size:28px;z-index:9;animation:fall 2s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.m{display:none;margin-top:8px;background:#e5fbef;border:2px solid #2ecc71;border-radius:14px;padding:8px}
</style></head><body>

b('🚨 تخيّل أن إنذار الحريق دق في مدرستك! هذا هو <b>الحادث الأمني</b>: موقف يحدث فيه ضرر فعلي بسبب مشكلة في أمن المعلومات (يؤثر في السرية أو السلامة أو التوافر). حتى أقوى حماية (كلمات مرور قوية، جدار حماية، مضاد فيروسات، تشفير، نسخ احتياطية) لا تمنع كل الحوادث، لذلك نستعد للاستجابة لا للوقاية فقط.','🚨 Imagine the fire alarm rings at school! That is a <b>security incident</b>: a situation where actual damage occurs due to an information security problem (affecting confidentiality, integrity or availability). Even strong protection (strong passwords, firewall, antivirus, encryption, backups) cannot stop every incident, so we must prepare to respond, not just prevent.')+'<div class="box"><table><tr><td><b>النوع / Type</b></td><td><b>الوصف / Description</b></td></tr><tr><td>تسرب المعلومات<br>Information leak</td><td>تسرب المعلومات الشخصية أو السرية إلى الخارج<br>Personal/confidential info leaked outside</td></tr><tr><td>التلاعب بالبيانات<br>Data tampering</td><td>تعديل البيانات داخل نظام دون تصريح<br>Data altered without authorization</td></tr><tr><td>انقطاع الخدمة<br>Service outage</td><td>تصبح الخدمة غير متاحة بسبب هجمات على الخادم<br>Service unavailable due to server attacks</td></tr></table></div>',
b('🧑‍🚒 الاستجابة تشبه خطة الإطفاء، ست مراحل <b>بالترتيب</b>:','🧑‍🚒 Response is like a firefighting plan — six stages <b>in order</b>:')+'<div class="st"><div>1️⃣ التحضير<br>Preparation<br><small>إعداد الإجراءات مسبقًا<br>Set up procedures</small></div><div>2️⃣ الاكتشاف<br>Detection<br><small>اكتشاف الحادث وتأكيده<br>Find &amp; confirm</small></div><div>3️⃣ الاحتواء<br>Containment<br><small>الحد من التأثير (عزل الجهاز)<br>Limit impact (isolate)</small></div><div>4️⃣ إزالة التهديد<br>Eradication<br><small>إزالة السبب الجذري<br>Remove root cause</small></div><div>5️⃣ الاستعادة<br>Recovery<br><small>استعادة الأنظمة (من نسخة سليمة)<br>Restore systems</small></div><div>6️⃣ الدروس المستفادة<br>Lessons learned<br><small>منع تكرار الحدث<br>Prevent recurrence</small></div></div>'+b('⚠️ لو استعدت النظام قبل إزالة الفيروس، يعود الفيروس! وقد تتداخل المراحل أو نعود لمرحلة سابقة (مثلاً: الاستعادة تكشف بقايا تهديد فنرجع للاحتواء). 🤔 <b>توقف وفكر:</b> لماذا يأتي الاحتواء قبل الاستئصال؟','⚠️ Recover before removing the virus and it comes back! Stages may overlap or loop back (e.g. recovery reveals leftover threat, so return to containment). 🤔 <b>Pause &amp; think:</b> why must containment come before eradication?'),
b('🎯 <b>الخطر</b> = احتمال أن يقع حدث يسبب ضررًا. لا نسأل فقط «هل سيحدث؟» بل سؤالين: ① إذا حدث، ما حجم الضرر؟ = <b>التأثير</b>. ② ما مدى احتمال حدوثه؟ = <b>الاحتمالية</b>. <b>درجة الخطر = التأثير × الاحتمالية</b>. نعالج الأخطر أولاً لأن الفريق لا يستطيع إصلاح كل شيء معًا.','🎯 <b>Risk</b> = the possibility of a problem occurring and its impact. Ask two questions: ① If it happens, how big is the damage? = <b>Impact</b>. ② How likely is it? = <b>Likelihood</b>. <b>Risk = Impact × Likelihood</b>. Fix the worst first because no team can fix everything at once.')+mat()+b('مثال: (أ) تأثير 3×احتمال 3 = 9، (ج) 3×2 = 6، (ب) 1×3 = 3، (د) 1×1 = 1 ← الترتيب: أ ثم ج ثم ب ثم د.','Example: (a) 3×3=9, (c) 3×2=6, (b) 1×3=3, (d) 1×1=1 → order: a, c, b, d.')];

const E=[['لماذا يجب أن يأتي الاحتواء قبل الاستئصال في الاستجابة ذات المراحل الست؟','Why must containment come before eradication in the six-stage response?','لأن الاحتواء يحدّ من انتشار الضرر ويعزل الجزء المتأثر أولاً؛ ولو أُزيل السبب قبل ذلك قد ينتشر التهديد إلى أنظمة أخرى أثناء المعالجة.','Containment limits the spread of damage by isolating the affected part first; removing the cause before that could let the threat spread to other systems meanwhile.'],
['اشرح أهمية التسلسل العام لمراحل الاستجابة للحوادث، مستخدمًا الاحتواء والاستئصال والاستعادة كمثال، ووضح لماذا قد تحتاج الاستجابة الفعلية إلى العودة إلى مرحلة سابقة. في إجابتك، ما يحدث إذا بدأت الاستعادة قبل إزالة السبب. [٦ درجات]','Explain the importance of the general order of the incident response stages, using containment, eradication and recovery as an example, and why real response may return to an earlier stage. In your answer, say what happens if recovery starts before the cause is removed. [6 marks]','الترتيب يساعد على الفهم: نحتوي أولاً لمنع انتشار الضرر، ثم نزيل السبب (البرمجيات الخبيثة والثغرة)، ثم نستعيد الأنظمة بأمان. وقد تتداخل الأنشطة أو نعود لمرحلة سابقة، فقد تكشف الاستعادة بقايا تهديد فنعود للاحتواء أو الإزالة. وإذا بدأت الاستعادة قبل إزالة السبب تبقى البرمجية الخبيثة والثغرة فيعود الحادث.','The order aids understanding: contain first to stop spread, then remove the cause (malware and vulnerability), then restore systems safely. Activities may overlap or loop back — recovery may reveal leftover threat, so return to containment or eradication. If recovery starts before the cause is removed, the malware and vulnerability remain and the incident can recur.'],
['تعرض نظام سجلات الطلاب في إحدى المدارس لهجوم ببرمجية فدية: شُفّرت الملفات ولم يعد الموظفون قادرين على تسجيل الدخول. اذكر المراحل التي لا يزال يتعين تنفيذها وماذا تعني بالنسبة لهذا الحادث، ثم قدّر المخاطر (هجوم آخر / انقطاع كهرباء قصير) وأوصِ بأول ثلاثة إجراءات.','A school student-records system is hit by ransomware: files are encrypted and staff are locked out. List the stages still to carry out and what each means here, assess the risks (another attack / brief power cut) and recommend the first three actions.','بعد الاكتشاف: الاحتواء (عزل الأجهزة المصابة عن الشبكة)، ثم إزالة التهديد (حذف البرمجية الخبيثة وسد الثغرة)، ثم الاستعادة (من نسخة احتياطية سليمة)، ثم الدروس المستفادة (تحليل السبب وتحسين الضوابط). هجوم آخر: تأثير كبير واحتمالية متوسطة/عالية فيُعالج أولاً؛ انقطاع الكهرباء: تأثير صغير واحتمالية متوسطة. أول ثلاثة إجراءات: الاحتواء ثم الإزالة ثم الاستعادة، لأن الاستعادة قبل الإزالة تُعيد المشكلة.','After detection: Containment (isolate infected machines), Eradication (remove malware, fix the hole), Recovery (restore from a clean backup), Lessons learned (analyze cause, improve controls). Another attack: high impact, medium/high likelihood → first; power cut: low impact, medium likelihood. First three actions: contain, eradicate, recover — recovering before eradicating brings the problem back.'],
['اكتشف متجر إلكتروني للتو أن بيانات العملاء قد تسرّبت. باستخدام مراحل الاستجابة الست وتقييم المخاطر، حدد المرحلتين التاليتين اللتين يجب تنفيذهما وسبب ذلك، وحدد خطرًا واحدًا ينبغي إعطاؤه الأولوية بعد ذلك.','An online shop has just detected that customer data has been leaked. Using the six stages and risk assessment, name the next two stages and why, and one risk to prioritize afterward.','المرحلتان التاليتان: الاحتواء (لإيقاف استمرار التسرب)، ثم إزالة التهديد (لإزالة السبب والثغرة). بعدها نعطي الأولوية لخطر ذي تأثير مرتفع واحتمالية مرتفعة مثل تكرار الوصول غير المصرح به.','Next two stages: Containment (stop the leak spreading) then Eradication (remove cause and vulnerability). Afterward prioritize a high-impact, high-likelihood risk such as repeated unauthorized access.'],
['ما المصطلح الذي يُطلق على حدث يؤثر في سرية المعلومات أو سلامتها أو توافرها؟ اذكر المراحل الست بالترتيب، وما العاملان المستخدمان لتحديد حجم المخاطرة؟','What is the term for an event affecting confidentiality, integrity or availability? Name the six stages in order, and the two factors that determine risk size.','الحادث الأمني. المراحل: التحضير ← الاكتشاف ← الاحتواء ← إزالة التهديد (الاستئصال) ← الاستعادة ← الدروس المستفادة والتحسين. العاملان: التأثير والاحتمالية (المخاطرة = التأثير × الاحتمالية).','Security incident. Stages: Preparation → Detection → Containment → Eradication → Recovery → Lessons learned / Prevention. Factors: Impact and Likelihood (Risk = Impact × Likelihood).']];
